[package]
name = "openfang-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/WebSocket API server for the OpenFang Agent OS daemon"

[dependencies]
openfang-types = { path = "../openfang-types" }
openfang-kernel = { path = "../openfang-kernel" }
openfang-runtime = { path = "../openfang-runtime" }
openfang-memory = { path = "../openfang-memory" }
openfang-channels = { path = "../openfang-channels", default-features = false }
openfang-wire = { path = "../openfang-wire" }
openfang-skills = { path = "../openfang-skills" }
openfang-hands = { path = "../openfang-hands" }
openfang-extensions = { path = "../openfang-extensions" }
openfang-migrate = { path = "../openfang-migrate" }
dashmap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
tokio-stream = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
socket2 = { workspace = true }
reqwest = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

[features]
# Default: core four adapters only (Discord/Telegram/Slack/Matrix).
# `full-channels` adds the other 36; the CLI and desktop binaries enable it.
default = []
full-channels = ["email", "google_chat", "irc", "mattermost", "rocketchat", "signal", "teams", "twitch", "whatsapp", "xmpp", "zulip", "bluesky", "feishu", "line", "mastodon", "messenger", "reddit", "revolt", "viber", "flock", "guilded", "keybase", "nextcloud", "nostr", "pumble", "threema", "twist", "webex", "dingtalk", "dingtalk_stream", "discourse", "gitter", "gotify", "linkedin", "mumble", "mqtt", "ntfy", "webhook", "wecom"]
email = ["openfang-channels/email"]
google_chat = ["openfang-channels/google_chat"]
irc = ["openfang-channels/irc"]
mattermost = ["openfang-channels/mattermost"]
rocketchat = ["openfang-channels/rocketchat"]
signal = ["openfang-channels/signal"]
teams = ["openfang-channels/teams"]
twitch = ["openfang-channels/twitch"]
whatsapp = ["openfang-channels/whatsapp"]
xmpp = ["openfang-channels/xmpp"]
zulip = ["openfang-channels/zulip"]
bluesky = ["openfang-channels/bluesky"]
feishu = ["openfang-channels/feishu"]
line = ["openfang-channels/line"]
mastodon = ["openfang-channels/mastodon"]
messenger = ["openfang-channels/messenger"]
reddit = ["openfang-channels/reddit"]
revolt = ["openfang-channels/revolt"]
viber = ["openfang-channels/viber"]
flock = ["openfang-channels/flock"]
guilded = ["openfang-channels/guilded"]
keybase = ["openfang-channels/keybase"]
nextcloud = ["openfang-channels/nextcloud"]
nostr = ["openfang-channels/nostr"]
pumble = ["openfang-channels/pumble"]
threema = ["openfang-channels/threema"]
twist = ["openfang-channels/twist"]
webex = ["openfang-channels/webex"]
dingtalk = ["openfang-channels/dingtalk"]
dingtalk_stream = ["openfang-channels/dingtalk_stream"]
discourse = ["openfang-channels/discourse"]
gitter = ["openfang-channels/gitter"]
gotify = ["openfang-channels/gotify"]
linkedin = ["openfang-channels/linkedin"]
mumble = ["openfang-channels/mumble"]
mqtt = ["openfang-channels/mqtt"]
