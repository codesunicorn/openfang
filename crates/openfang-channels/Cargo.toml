[package]
name = "openfang-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Channel Bridge Layer — pluggable messaging integrations for OpenFang"

[dependencies]
openfang-types = { path = "../openfang-types" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
axum = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
aes = "0.8"
cbc = "0.1"
base64 = { workspace = true }
hex = { workspace = true }
html-escape = { workspace = true }
regex-lite = "0.1"
roxmltree = "0.21"

lettre = { workspace = true }
imap = { workspace = true }
native-tls = { workspace = true }
mailparse = { workspace = true }
rumqttc = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
default = ["discord", "telegram", "slack", "matrix"]
# NOTE: api/cli forward per-adapter features; the four above are the guaranteed core.
all = ["bluesky", "dingtalk", "dingtalk_stream", "discourse", "email", "feishu", "flock", "gitter", "google_chat", "gotify", "guilded", "irc", "keybase", "line", "linkedin", "mastodon", "mattermost", "messenger", "mumble", "nextcloud", "nostr", "ntfy", "pumble", "reddit", "revolt", "rocketchat", "signal", "teams", "threema", "twist", "twitch", "viber", "webex", "webhook", "wecom", "whatsapp", "xmpp", "zulip", "mqtt"]
